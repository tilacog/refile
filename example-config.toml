# Refile Configuration File
#
# This is an example configuration file for refile, a CLI tool that organizes
# files into calendar-based buckets based on their modification time.
#
# Location: ~/.config/refile/config.toml
#
# Generate this file with: refile config init

# =============================================================================
# CONFIGURATION PRECEDENCE (highest to lowest priority)
# =============================================================================
# 1. CLI arguments (--base-folder, --buckets)
# 2. Directory-specific rules from this config file
# 3. [default] section from this config file
# 4. Built-in defaults
#
# This means CLI arguments always win, followed by matching rules, then
# the default section, and finally the built-in defaults if nothing else is set.

# =============================================================================
# DEFAULT CONFIGURATION
# =============================================================================
# The [default] section provides the baseline configuration used when no
# directory-specific rule matches and no CLI arguments are provided.

[default]
# Base folder name - this is the directory created to hold organized buckets
# Default: "refile"
base_folder = "refile"

# Bucket definitions - files are organized into these calendar-based categories.
#
# Buckets are an ORDERED list of tables. Each bucket has:
#   - name:   the folder name created under the base folder
#   - period: the calendar period it captures (see PERIODS below)
#
# Buckets are evaluated top to bottom and the FIRST match wins, so the newest
# periods must be listed first. The last bucket MUST be the catch-all ("null").

[[default.buckets]]
# Files modified since the most recent Sunday 00:00 UTC
name = "current-week"
period = "current-week"

[[default.buckets]]
# Files modified in the previous calendar week (Sunday–Saturday)
name = "last-week"
period = "last-week"

[[default.buckets]]
# Files modified earlier this calendar month (before last week)
name = "current-month"
period = "current-month"

[[default.buckets]]
# Files modified in the previous calendar month
name = "last-month"
period = "last-month"

[[default.buckets]]
# Catch-all: everything older than the previous month (REQUIRED, must be last)
name = "old-stuff"
period = "null"

# =============================================================================
# DIRECTORY-SPECIFIC RULES
# =============================================================================
# Rules allow you to customize bucket configuration for specific directories.
# When you run refile on a path, it checks if any rule matches that path.
# The first matching rule's configuration is used.

# Example: Downloads folder with a simpler, weekly-only layout
[[rules]]
path = "~/Downloads"
base_folder = "sorted"

[[rules.buckets]]
name = "this-week"
period = "current-week"

[[rules.buckets]]
name = "last-week"
period = "last-week"

[[rules.buckets]]
name = "archive"
period = "null"

# Example: Documents folder organized by month
[[rules]]
path = "~/Documents"
base_folder = "organized"

[[rules.buckets]]
name = "current"
period = "current-month"

[[rules.buckets]]
name = "previous"
period = "last-month"

[[rules.buckets]]
name = "archive"
period = "null"

# =============================================================================
# PERIODS
# =============================================================================
# Valid period keywords (everything is computed in UTC; weeks start on Sunday):
#   - current-week   files modified since the most recent Sunday 00:00
#   - last-week      files modified in the previous Sunday–Saturday week
#   - current-month  files modified since the first day of the current month
#   - last-month     files modified during the previous calendar month
#   - null           catch-all for everything older (must be the last bucket)
#
# Because periods are anchored to the calendar, the bucket a file lands in
# changes as the calendar advances. Periods can also overlap near month
# boundaries (e.g. when the current week started in the previous month): the
# earlier-listed bucket wins, which is why ordering matters.

# =============================================================================
# BUCKET NAMING CONVENTIONS
# =============================================================================
# - Use lowercase with hyphens (e.g., "last-week", "old-stuff")
# - Avoid special characters like / or \
# - The "name" is just the folder; the "period" decides what it captures, so
#   you can name a folder however you like (e.g. name = "this-week",
#   period = "current-week").

# =============================================================================
# TIMESTAMP CALCULATION
# =============================================================================
# Bucketing is based on the file/directory's modification time (mtime):
# - For files: the last time the file content was modified
# - For directories: the directory's own mtime (not the files inside)
# - Directories are moved as whole units, not recursed into.

# =============================================================================
# PATH MATCHING
# =============================================================================
# - Paths support tilde expansion: ~/Downloads → /home/user/Downloads
# - Matching is done by canonicalizing both the rule path and target path

# =============================================================================
# USAGE EXAMPLES
# =============================================================================
# Basic usage (uses config):
#   refile ~/Downloads
#
# Override base folder via CLI:
#   refile --base-folder archive ~/Documents
#
# Override buckets via CLI (name=period pairs):
#   refile --buckets "recent=current-week,monthly=current-month,old=null" ~/Projects
#
# Dry run (see what would happen):
#   refile --dry-run ~/Downloads
#
# Handle conflicts by renaming:
#   refile --allow-rename ~/Downloads
#
# Organize into separate target:
#   refile ~/Downloads ~/organized
#
# Show this config:
#   refile config dump
#
# Show where config is loaded from:
#   refile config path
#
# Validate config file:
#   refile config validate

# =============================================================================
# TROUBLESHOOTING
# =============================================================================
# - Config not loading? Check the path with: refile config path
# - Invalid config? Validate with: refile config validate
# - The last bucket must be the catch-all (period = "null")
# - Bucket names cannot contain / or \ characters
